name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastmigrate
          POSTGRES_PASSWORD: fastmigrate_test
          POSTGRES_DB: fastmigrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastmigrate -d fastmigrate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FASTMIGRATE_TEST_DATABASE_URL: postgresql+psycopg://fastmigrate:fastmigrate_test@localhost:5432/fastmigrate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[postgres,test]"
      - run: fastmigrate --help
      - run: python manage.py --help
      - run: python -m pytest -q --strict-markers --cov=fastmigrate --cov-report=term-missing --cov-fail-under=80
